  <text x="116" y="77" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="500" fill="#cfe0f3" text-anchor="start">A bounded, browser-based analysis workflow</text>
  <rect x="875" y="29" width="280" height="42" rx="21" fill="#16344f" stroke="none" stroke-width="0"/><text x="1015" y="57" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700" fill="#c9fff5" text-anchor="middle">Planned private-app concept</text>
  
    
