  <text x="70" y="205" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900" fill="#172033" text-anchor="start">De-identified</text>
  <text x="70" y="233" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="500" fill="#5f6f89" text-anchor="start">structured CSV only</text>

    
